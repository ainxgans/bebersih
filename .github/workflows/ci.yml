name: CI & Linux Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Check frontend build
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build Linux (.deb & .AppImage)
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles deb,appimage

      - name: Determine Release Tag and Title
        id: release_meta
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="Bebersih ${TAG}"
          else
            VERSION=$(node -p "require('./package.json').version")
            if gh release view "v${VERSION}" >/dev/null 2>&1; then
              TAG="v${VERSION}-build.${{ github.run_number }}"
              TITLE="Bebersih v${VERSION} (Build ${{ github.run_number }})"
            else
              TAG="v${VERSION}"
              TITLE="Bebersih v${VERSION}"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release with Release Notes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="${{ steps.release_meta.outputs.title }}"

          # Locate built deb and AppImage files without duplicates
          FILES=()
          while IFS= read -r f; do
            [ -n "$f" ] && FILES+=("$f")
          done < <(find src-tauri/target -path "*/bundle/*" -type f \( -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null | sort -u)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No release bundles found to upload!"
            exit 1
          fi

          echo "Found bundles to release: ${FILES[*]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --generate-notes
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TITLE" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi

      - name: Upload Linux bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: bebersih-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/bundle/deb/*.deb
            src-tauri/target/*/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: warn
